    <script>
      function menuToggle() {
        const menu = document.getElementById("menu");
        if (!menu) {
          return;
        }
        menu.classList.toggle("h-32");
      }

      function syncMenuLayout() {
        const menu = document.getElementById("menu");
        if (!menu) {
          return;
        }
        const windowWidth = window.innerWidth || document.body.clientWidth;
        if (windowWidth > 640) {
          menu.classList.remove("h-32");
        }
      }

      window.addEventListener("resize", syncMenuLayout, { passive: true });

      document.addEventListener("DOMContentLoaded", function () {
        syncMenuLayout();
        requestAnimationFrame(function () {
          document.body.classList.remove("opacity-0");
          document.body.classList.add("opacity-100");
        });
      });

          const script = document.createElement('script');
          script.src = '/web/photography/dist/cplayer.min.js';
          script.onload = function() {
            initMusicPlayer();
          };
          script.onerror = function() {
            console.error('Failed to load cplayer.min.js');
            var audioLoading = document.getElementById("audio-loading");
            if (audioLoading) {
              audioLoading.innerHTML = '<span style="color: #999;">音乐播放器加载失败</span>';
            }
          };
          document.body.appendChild(script);
        }
        
        // 监听hover事件，首次hover时加载播放器
        document.addEventListener('DOMContentLoaded', function() {
          const headerContainer = document.querySelector('.portfolio-header-container');
          if (headerContainer) {
            // Desktop: mouseenter
            headerContainer.addEventListener('mouseenter', loadCplayer, { once: true });
            // Mobile: touchstart or click
            headerContainer.addEventListener('touchstart', loadCplayer, { once: true, passive: true });
            headerContainer.addEventListener('click', loadCplayer, { once: true });
          }
        });
      })();
    </script>

    <script>
      let isCollapsed = false;
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const texts = document.querySelectorAll(".sidebar-text");
        if (!isCollapsed) {
          sidebar.style.width = "64px";
          texts.forEach((el) => (el.style.display = "none"));
        } else {
          sidebar.style.width = "16rem"; // Tailwind w-64
          texts.forEach((el) => (el.style.display = "inline"));
        }
        isCollapsed = !isCollapsed;
      }
    </script>
    <script>
      // Mobile Music Player Toggle
      document.addEventListener('DOMContentLoaded', function() {
        const headerContainer = document.querySelector('.portfolio-header-container');
        const tooltip = document.querySelector('.music-player-tooltip');
        
        if (headerContainer && tooltip) {
          headerContainer.addEventListener('click', function(e) {
            if (window.innerWidth < 768) {
              e.stopPropagation();
              tooltip.classList.toggle('mobile-show');
            }
          });
          
          tooltip.addEventListener('click', function(e) {
             e.stopPropagation(); // Prevent closing when clicking inside the player
          });
          
          document.addEventListener('click', function() {
            if (window.innerWidth < 768) {
              tooltip.classList.remove('mobile-show');
            }
          });
        }
      });
    </script>
    <script>
      // 自动处理所有图片骨架和显示问题（防止 null.style 报错）
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("a[href], img[src]").forEach(function (el) {
          if (el.getAttribute("href"))
            el.setAttribute("href", el.getAttribute("href").trim());
          if (el.getAttribute("src"))
            el.setAttribute("src", el.getAttribute("src").trim());
        });
        const checkAllImages = () => {
          document.querySelectorAll("img.img-loading").forEach(function (img) {
            if (img.src) img.src = img.src.trim();
            if (img.dataset.loaded === "true") return;
            if (img.dataset.loadBound === "true") return;
            if (!img.currentSrc && !img.getAttribute("src")) return;
            
            let isLoaded = false;
            
            function hideSkeleton(evt) {
              if (isLoaded) return;
              isLoaded = true;
              img.dataset.loaded = "true";
              img.dataset.loadBound = "true";
              
              let parent = img.parentElement && img.parentElement.parentElement;
              let skeleton = parent
                ? parent.querySelector(".img-skeleton")
                : null;
              
              void img.offsetWidth;
              
              requestAnimationFrame(() => {
                img.classList.remove("img-loading");
                img.classList.remove("opacity-0");
                if (img) {
                  img.style.opacity = '1';
                  img.style.visibility = 'visible';
                }
                if (skeleton) {
                  skeleton.remove();
                }
              });
            }
            
            function checkImageLoaded() {
              if (img.complete && img.naturalWidth > 0) {
                hideSkeleton();
                return true;
              }
              return false;
            }
            
            if (checkImageLoaded()) return;
            
            img.dataset.loadBound = "true";
            img.addEventListener("load", hideSkeleton, { once: true });
            img.addEventListener("error", hideSkeleton, { once: true });
          });
        };
        
        checkAllImages();
        
        let checks = 0;
        const interval = setInterval(() => {
          checkAllImages();
          checks++;
          if (checks > 50) clearInterval(interval);
        }, 100);
        
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            checkAllImages();
          }
        });
        
        window.addEventListener("pageshow", () => {
          checkAllImages();
        });
        
        window.addEventListener("load", () => {
          setTimeout(checkAllImages, 500);
        });
      });
    </script>
  </body>

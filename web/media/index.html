  <body class="media-page site-shell-page">
    <header data-site-shell data-site-root="../../" data-site-active="media"></header>

    <main class="site-shell-main media-main">
      <section class="media-hero">
        <h1 class="media-title">MEDIA</h1>
      </section>

      <nav class="media-tabs" role="tablist" aria-label="书影音分类">
        <button class="media-tab" id="media-tab-music" type="button" role="tab" data-media-tab="music" aria-controls="media-music">音乐</button>
        <button class="media-tab" id="media-tab-book" type="button" role="tab" data-media-tab="book" aria-controls="media-book">书籍</button>
        <button class="media-tab" id="media-tab-movie" type="button" role="tab" data-media-tab="movie" aria-controls="media-movie">电影</button>
        <button class="media-tab" id="media-tab-tv" type="button" role="tab" data-media-tab="tv" aria-controls="media-tv">剧集</button>
        <button class="media-tab" id="media-tab-game" type="button" role="tab" data-media-tab="game" aria-controls="media-game">游戏</button>
        <button class="media-tab" id="media-tab-podcast" type="button" role="tab" data-media-tab="podcast" aria-controls="media-podcast">播客</button>
      </nav>
      <p class="media-intro">
        记录这些已经看过、听过或玩过的书籍、电影、专辑、剧集、游戏和播客记录。放在这里，也只是放在这里。给自己看或给你看。
      </p>

      <section class="media-section" id="media-music" role="tabpanel" aria-labelledby="media-tab-music">
        <div class="media-section-head">
          <h2>音乐</h2>
          <span class="media-count">加载中</span>
        </div>
        <div class="media-section-body"></div>
      </section>

      <section class="media-section" id="media-book" role="tabpanel" aria-labelledby="media-tab-book" hidden>
        <div class="media-section-head">
          <h2>书籍</h2>
          <span class="media-count">加载中</span>
        </div>
        <div class="media-section-body"></div>
      </section>

      <section class="media-section" id="media-movie" role="tabpanel" aria-labelledby="media-tab-movie" hidden>
        <div class="media-section-head">
          <h2>电影</h2>
          <span class="media-count">加载中</span>
        </div>
        <div class="media-section-body"></div>
      </section>

      <section class="media-section" id="media-tv" role="tabpanel" aria-labelledby="media-tab-tv" hidden>
        <div class="media-section-head">
          <h2>剧集</h2>
          <span class="media-count">加载中</span>
        </div>
        <div class="media-section-body"></div>
      </section>

      <section class="media-section" id="media-game" role="tabpanel" aria-labelledby="media-tab-game" hidden>
        <div class="media-section-head">
          <h2>游戏</h2>
          <span class="media-count">加载中</span>
        </div>
        <div class="media-section-body"></div>
      </section>

      <section class="media-section" id="media-podcast" role="tabpanel" aria-labelledby="media-tab-podcast" hidden>
        <div class="media-section-head">
          <h2>播客</h2>
          <span class="media-count">加载中</span>
        </div>
        <div class="media-section-body"></div>
      </section>

      <div class="media-bottom-bar">
        <div class="media-bottom-inner">
          <div id="media-pagination-slot" class="media-pagination-slot"></div>
          <footer class="media-footer">
            <div id="media-total">正在加载记录</div>
            <div>每日从 NeoDB 更新</div>
          </footer>
        </div>
      </div>
    </main>
